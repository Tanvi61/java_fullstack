<div class="container">
  <div class="card">

    <h2>Health Tracker</h2>
    <p class="subtitle">Track heart rate & sleep</p>

    <!-- INPUTS -->
    <div class="form-group">
      <input 
        type="number" 
        [(ngModel)]="heartRate" 
        placeholder="Heart Rate (bpm)" 
        min="30" 
        max="200"
      >
    </div>

    <div class="form-group">
      <input 
        type="number" 
        [(ngModel)]="sleep" 
        placeholder="Sleep Hours" 
        min="0" 
        max="24" 
        step="0.1"
      >
    </div>

    <!-- SAVE BUTTON -->
    <button 
      (click)="submit()" 
      [disabled]="heartRate == null || sleep == null">
      Save
    </button>

    <!-- MESSAGE -->
    <p class="message" *ngIf="message">{{ message }}</p>

    <!-- LAST RECORD -->
    @if (lastHealth) {
      <div class="last">
      <h4>Last Record</h4>
      <p>❤️ Heart Rate: {{ lastHealth.heartRate }} bpm</p>
      <p>😴 Sleep: {{ lastHealth.sleepHours }} hrs</p>
      @if (lastHealth.timestamp) { <p>🕒 {{ lastHealth.timestamp | date:'medium' }}</p> }
      </div>
    } @else {
      <div class="last">
        <p>No records found yet 📭</p>
      </div>
    }

    <!-- BACK BUTTON -->
    <button class="back" (click)="goBack()">← Back</button>

  </div>
</div>
